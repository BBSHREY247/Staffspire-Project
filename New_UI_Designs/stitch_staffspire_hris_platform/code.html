</button>
<div class="flex flex-col">
<h1 class="text-headline-sm font-headline-sm text-primary tracking-tight">Add New Employee</h1>
<span class="text-label-sm font-label-sm text-secondary">Directory &gt; Recruitment</span>
</div>
</div>

<img alt="Softspire Solutions Logo" class="h-8 w-auto object-contain hidden md:block opacity-80" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDP1ai0YVOKz7hN7EOCnfkv-NV4T7drwRm593XFyIkg_QTBlsLSRd2MhoaNSe4W1CIV49DgKvy-f8J9BKjtizDwhhR143L5vjsC4sw9A2YvRLiGg57t7YjYytqggJGY1ASzzUSm2H5qkqyy4-4vluFzTZ6WksHtuFulgyQDfgMXDnMFzNDFxALnJ_hAw_znQSdYWOEVA88ZGm_-kI2CUtP8f-HUV-jg9NgrGFzPqoaW_JLqFiyW2IRjRf6P0uGot_H2JcyL_2fuXA"/>

<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-0.5 bg-surface-container-high -z-10"></div>

<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center text-label-md font-label-md shadow-sm ring-4 ring-surface">2</div>

</div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center text-label-md font-label-md shadow-sm ring-4 ring-surface">3</div>
<span class="text-label-sm font-label-sm text-secondary">Role &amp; Access</span>
</div>
</div>

<form class="space-y-8">
<!-- Section: Personal Information -->
<section class="bg-surface-container-lowest border border-outline-variant/30 rounded-lg p-lg shadow-sm">
<div class="mb-6 border-b border-outline-variant/20 pb-4">
<h2 class="text-headline-sm font-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">person</span>
                                Personal Information
                            </h2>
<p class="text-body-sm font-body-sm text-secondary mt-1">Basic details and contact information.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Field: First Name -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="firstName">First Name <span class="text-error">*</span></label>
<input class="w-full h-10 px-3 bg-surface border border-outline-variant rounded-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest focus:border-transparent transition-all" id="firstName" name="firstName" placeholder="e.g. Jane" required="" type="text"/>
</div>
<!-- Field: Last Name -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="lastName">Last Name <span class="text-error">*</span></label>
<input class="w-full h-10 px-3 bg-surface border border-outline-variant rounded-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest focus:border-transparent transition-all" id="lastName" name="lastName" placeholder="e.g. Doe" required="" type="text"/>
</div>
<!-- Field: Email -->
<div class="space-y-2 md:col-span-2">
<label class="block text-label-md font-label-md text-on-surface" for="email">Work Email <span class="text-error">*</span></label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-[20px]">mail</span>
</span>
<input class="w-full h-10 pl-10 pr-3 bg-surface border border-outline-variant rounded-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest focus:border-transparent transition-all" id="email" name="email" placeholder="jane.doe@staffspire.com" required="" type="email"/>
</div>
</div>
</div>
</section>
<!-- Section: Employment Details -->
<section class="bg-surface-container-lowest border border-outline-variant/30 rounded-lg p-lg shadow-sm">
<div class="mb-6 border-b border-outline-variant/20 pb-4">
<h2 class="text-headline-sm font-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">work</span>
                                Employment Details
                            </h2>
<p class="text-body-sm font-body-sm text-secondary mt-1">Organizational placement and start dates.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Field: Employee ID -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="empId">Employee ID</label>
<input class="w-full h-10 px-3 bg-surface-container-low border border-outline-variant/50 rounded-md text-body-md text-secondary cursor-not-allowed" id="empId" name="empId" placeholder="EMP-0000" readonly="" type="text" value="EMP-8924"/>
<p class="text-label-sm font-label-sm text-secondary">Auto-generated.</p>
</div>
<!-- Field: Start Date -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="startDate">Start Date <span class="text-error">*</span></label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-[20px]">calendar_today</span>
</span>
<input class="w-full h-10 pl-10 pr-3 bg-surface border border-outline-variant rounded-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest focus:border-transparent transition-all text-on-surface" id="startDate" name="startDate" required="" type="date"/>
</div>
</div>
<!-- Field: Department -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="department">Department <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full h-10 pl-3 pr-10 bg-surface border border-outline-variant rounded-md text-body-md appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest focus:border-transparent transition-all" id="department" name="department" required="">
<option disabled="" selected="" value="">Select department...</option>
<option value="engineering">Engineering</option>
<option value="design">Design</option>
<option value="hr">Human Resources</option>
<option value="sales">Sales</option>
</select>
<span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary">expand_more</span>
</span>
</div>
</div>
<!-- Field: Designation -->
<div class="space-y-2">
<label class="flex items-center gap-1 text-label-md font-label-md text-on-surface" for="designation">
                                    Designation <span class="text-error">*</span>
<span class="material-symbols-outlined text-secondary text-[16px] cursor-help" title="Official job title as per employment contract.">help</span>
</label>
<input class="w-full h-10 px-3 bg-surface border border-outline-variant rounded-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest focus:border-transparent transition-all" id="designation" name="designation" placeholder="e.g. Senior Frontend Developer" required="" type="text"/>
</div>
</div>
</section>
<!-- Form Actions -->
<div class="flex items-center justify-end gap-4 pt-4 border-t border-outline-variant/30 mt-8">
<button class="px-6 py-2 rounded-lg text-label-md font-label-md text-secondary hover:bg-surface-container-low hover:text-on-surface transition-colors duration-200" type="button">
                            Cancel
                        </button>
<button class="px-6 py-2 rounded-lg text-label-md font-label-md bg-primary text-on-primary hover:bg-on-primary-fixed-variant shadow-sm transition-all duration-200 flex items-center gap-2" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
                            Save &amp; Continue

</div>
