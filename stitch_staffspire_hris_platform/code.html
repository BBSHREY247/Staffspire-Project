<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs tracking-tight">Welcome back</h1>
<p class="font-body-md text-body-md text-secondary">Log in to your StaffSpire enterprise portal to manage human capital.</p>

<form class="space-y-md">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email or Employee ID</label>
<input class="block w-full h-[40px] px-md py-sm border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:ring-2 focus:ring-[#4f46e5] focus:border-[#4f46e5] focus:outline-none transition-shadow" id="email" name="email" placeholder="Enter Email or Employee ID" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<input class="block w-full h-[40px] pl-md pr-xl py-sm border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline focus:ring-2 focus:ring-[#4f46e5] focus:border-[#4f46e5] focus:outline-none transition-shadow" id="password" name="password" placeholder="Enter Password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-sm text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-sm">
<div class="flex items-center">
<input class="h-4 w-4 text-[#4f46e5] focus:ring-[#4f46e5] border-outline-variant rounded bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-sm text-body-sm text-secondary cursor-pointer" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-[#4f46e5] hover:text-[#4338ca] transition-colors" href="#">
                                Forgot Password?
                            </a>
</div>
</div>
<div class="pt-md">
<button class="w-full flex justify-center items-center h-[40px] px-md py-sm border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-white bg-[#4f46e5] hover:bg-[#4338ca] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#4f46e5] transition-colors" type="submit">
                            Login
                        </button>
</div>

<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-secondary">
